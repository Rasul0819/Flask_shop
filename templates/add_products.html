<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Tovar qosiw — Tovarlar</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
  <header class="border-b border-white/10 bg-gray-900/80">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-5">
      <a href="{{ url_for('homepage') }}" class="flex items-center gap-3 text-white">
        <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-purple-600 shadow-lg shadow-purple-950/40">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" class="h-6 w-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6M10 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
          </svg>
        </span>
        <span>
          <span class="block text-lg font-bold tracking-tight">Tovarlar</span>
          <span class="block text-xs text-gray-400">Online shop</span>
        </span>
      </a>

      <a href="{{ url_for('homepage') }}" class="inline-flex items-center gap-2 rounded-xl border border-white/10 px-4 py-2.5 text-sm font-medium text-gray-300 transition hover:border-purple-400/40 hover:bg-white/5 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Katalogqa qaytiw
      </a>
    </div>
  </header>

  <main class="relative isolate min-h-[calc(100vh-145px)] overflow-hidden px-5 py-14 sm:py-20">
    <div class="absolute inset-0 -z-10 bg-gradient-to-br from-purple-950/50 via-gray-950 to-gray-950"></div>
    <div class="absolute -right-24 -top-24 -z-10 h-80 w-80 rounded-full bg-purple-600/15 blur-3xl"></div>
    <div class="mx-auto max-w-2xl">
      <div class="mb-8 text-center">
        <p class="mb-4 inline-flex items-center gap-2 rounded-full border border-purple-400/20 bg-purple-400/10 px-3 py-1.5 text-xs font-semibold uppercase tracking-[0.18em] text-purple-200">
          <span class="h-1.5 w-1.5 rounded-full bg-purple-300"></span>
          Tovarlar katalogi
        </p>
        <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Jańa tovar qosiw</h1>
        <p class="mt-3 text-sm leading-6 text-gray-400 sm:text-base">Tovar magliwmatlarin toltirip, katalogqa qosıń.</p>
      </div>

      <form
        action="{{ url_for('add_pr') }}"
        method="post"
        enctype="multipart/form-data"
        class="rounded-2xl border border-white/10 bg-gray-900/90 p-6 shadow-2xl shadow-black/20 sm:p-8"
      >
        <div class="space-y-6">
          <div>
            <label for="product" class="mb-2 block text-sm font-medium text-gray-200">Tovardin ati</label>
            <input
              id="product"
              type="text"
              name="product"
              class="w-full rounded-xl border border-white/10 bg-gray-950 px-4 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20"
              placeholder="Tovar atın jazıń"
            >
          </div>

          <div>
            <label for="price" class="mb-2 block text-sm font-medium text-gray-200">Tovardin cenasi</label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-sm text-gray-500">$</span>
              <input
                id="price"
                type="number"
                name="price"
                class="w-full rounded-xl border border-white/10 bg-gray-950 py-3 pl-9 pr-4 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20"
                placeholder="0"
              >
            </div>
          </div>

          <div>
            <label for="description" class="mb-2 block text-sm font-medium text-gray-200">Tovar haqqinda</label>
            <textarea
              id="description"
              name="decription"
              rows="4"
              class="w-full resize-y rounded-xl border border-white/10 bg-gray-950 px-4 py-3 text-sm text-white outline-none transition placeholder:text-gray-600 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20"
              placeholder="Tovar haqqinda qısqasha jazıń"
            ></textarea>
          </div>

          <div>
            <label for="image" class="mb-2 block text-sm font-medium text-gray-200">Tovar fotosi</label>
            <input
              id="image"
              type="file"
              name="image"
              accept="image/*"
              class="block w-full cursor-pointer rounded-xl border border-white/10 bg-gray-950 text-sm text-gray-400 file:mr-4 file:cursor-pointer file:border-0 file:bg-purple-600 file:px-4 file:py-3 file:text-sm file:font-semibold file:text-white hover:file:bg-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30"
            >
            <p class="mt-2 text-xs text-gray-500">JPG, PNG yamasa basqa súwret formatin tańlań.</p>
          </div>
        </div>

        <div class="mt-8 border-t border-white/10 pt-6">
          <button
            type="submit"
            class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-purple-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-purple-950/30 transition hover:bg-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-2 focus:ring-offset-gray-900"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="h-4 w-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14"/>
            </svg>
            Product qosiw
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="border-t border-white/10 bg-gray-900">
    <div class="mx-auto flex max-w-7xl flex-col gap-2 px-5 py-6 text-sm text-gray-500 sm:flex-row sm:items-center sm:justify-between">
      <p class="font-semibold text-gray-300">Tovarlar</p>
      <p>© 2026 Tovarlar. Barliq huqiqlar qorǵalǵan.</p>
    </div>
  </footer>
</body>
</html>
